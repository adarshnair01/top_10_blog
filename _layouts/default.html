<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- SEO & Meta Tags -->
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.subtitle %}{{ page.subtitle }}{% else %}{{ site.description }}{% endif %}">
  <meta name="author" content="{{ page.author | default: site.author }}">
  
  <!-- Open Graph / Social SEO -->
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.subtitle | default: site.description }}">
  <meta property="og:type" content="article">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

  <!-- Sticky Header -->
  <header class="site-header">
    <div class="container nav-wrapper">
      <a href="{{ '/' | relative_url }}" class="site-title">
        🔥 <span class="gradient-text">TOP 10</span> JOURNAL
      </a>
      <nav class="nav-links">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="#about">About</a>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container" style="margin-top: 30px;">
    {{ content }}
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container">
      <p>&copy; {{ 'now' | date: "%Y" }} {{ site.title }} • Fact-Checked AI Storytelling Engine</p>
      <p style="margin-top: 6px; font-size: 0.75rem; color: var(--text-dim);">Lightweight & Fast Jekyll Powered Blog</p>
    </div>
  </footer>

</body>
</html>
