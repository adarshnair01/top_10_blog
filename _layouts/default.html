<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- SEO & Meta Tags -->
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.subtitle %}{{ page.subtitle }}{% else %}{{ site.description }}{% endif %}">
  <meta name="author" content="{{ page.author | default: site.author }}">
  
  <!-- Open Graph / Social SEO -->
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.subtitle | default: site.description }}">
  <meta property="og:type" content="article">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Premium Typography: Outfit + Syne + Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">

  <!-- Theme Stylesheet -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

  <!-- Background Ambient Glows -->
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <!-- Sticky Glass Header -->
  <header class="site-header">
    <div class="container nav-wrapper">
      <a href="{{ '/' | relative_url }}" class="site-logo">
        <div class="logo-icon">🔥</div>
        <div class="logo-text">
          <span class="brand-title">TOP 10 <span class="brand-accent">JOURNAL</span></span>
          <span class="brand-subtitle">Fact-Checked Trend Engine</span>
        </div>
      </a>

      <nav class="nav-links">
        <a href="{{ '/' | relative_url }}" class="nav-link active">Home</a>
        <a href="{{ '/' | relative_url }}#categories" class="nav-link">Categories</a>
      </nav>
    </div>
  </header>

  <!-- Main Container -->
  <main class="container">
    {{ content }}
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container footer-content">
      <div class="footer-brand">
        <div class="site-logo">
          <div class="logo-icon">🔥</div>
          <span class="brand-title" style="color: #fff;">TOP 10 JOURNAL</span>
        </div>
        <p style="margin-top: 8px; font-size: 0.85rem; color: var(--text-dim);">
          Investigative fact-checking & immersive countdown storytelling on global trends.
        </p>
      </div>

      <div class="footer-copy">
        <p>&copy; {{ 'now' | date: "%Y" }} TOP 10 JOURNAL • Powered by Gemini AI</p>
      </div>
    </div>
  </footer>

</body>
</html>
